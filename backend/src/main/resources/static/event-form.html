<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create / Edit Event - EventManager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar"></div>

    <div class="container">
        <div class="page-banner" style="--banner-img:url('../images/cat-technical.png');min-height:80px;padding:22px 32px;">
            <span class="eyebrow">✨ Event builder</span>
            <h1 style="font-size:22px;" id="bannerTitle">Create a New Event</h1>
        </div>

        <div class="form-box wide">
            <h1 id="formTitle">Create Event</h1>
            <div id="alertBox"></div>

            <form id="eventForm">
                <div class="form-group">
                    <label for="name">Event Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" required></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="eventDate">Date</label>
                        <input type="date" id="eventDate" required>
                    </div>
                    <div class="form-group">
                        <label for="eventTime">Time</label>
                        <input type="time" id="eventTime" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="venue">Venue</label>
                        <input type="text" id="venue" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <input type="text" id="category" placeholder="e.g. Workshop, Cultural, Sports" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="maxParticipants">Maximum Participants</label>
                        <input type="number" id="maxParticipants" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="ticketPrice">Ticket Price (0 = Free)</label>
                        <input type="number" id="ticketPrice" min="0" step="0.01" required>
                    </div>
                </div>
                <button type="submit" class="btn" id="submitBtn">Create Event</button>
            </form>
        </div>

        <div id="scheduleSection" class="form-box wide" style="display:none;">
            <h2>Event Schedule</h2>
            <p class="subtitle">Add sessions attendees will see on the event details page.</p>
            <div id="scheduleAlert"></div>
            <div id="scheduleTable"></div>

            <h3 style="margin-top:20px;">Add Session</h3>
            <form id="scheduleForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="sessionName">Session Name</label>
                        <input type="text" id="sessionName" required>
                    </div>
                    <div class="form-group">
                        <label for="startTime">Start Time</label>
                        <input type="time" id="startTime" required>
                    </div>
                    <div class="form-group">
                        <label for="endTime">End Time</label>
                        <input type="time" id="endTime" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="sessionDescription">Description</label>
                    <textarea id="sessionDescription"></textarea>
                </div>
                <button type="submit" class="btn secondary">Add Session</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/common.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/event-form.js"></script>
</body>
</html>
