# ===== Server =====
# PORT is injected automatically by cloud hosts (e.g. Railway); 8081 is used
# locally only. Locally, 8080 was already occupied by an unrelated Windows
# process on this machine, which is why 8081 is the local fallback.
server.port=${PORT:8081}

# ===== MySQL Database =====
# Local dev: create the database first -> CREATE DATABASE event_management_db;
#   Then just run the app - these defaults (localhost/root/root) are used.
# Cloud deploy (e.g. Railway): set the MYSQLHOST / MYSQLPORT / MYSQLDATABASE /
#   MYSQLUSER / MYSQLPASSWORD environment variables on the service (Railway's
#   MySQL plugin provides these - reference them in the Variables tab).
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:event_management_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# "update" lets Hibernate auto-create/update tables from the entity classes
# on startup, so no manual SQL is required for a first run - locally or in
# the cloud, against a brand-new empty database.
# (database/schema.sql is provided separately as a reference / manual option.)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===== Jackson (JSON) =====
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.default-property-inclusion=non_null
