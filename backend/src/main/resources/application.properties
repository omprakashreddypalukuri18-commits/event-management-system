# ===== Server =====
# NOTE: 8080 was already occupied by another program on this machine (a
# Windows "AgentService" process unrelated to this project), so the app
# uses 8081 instead.
server.port=8081

# ===== MySQL Database =====
# Create the database first:  CREATE DATABASE event_management_db;
spring.datasource.url=jdbc:mysql://localhost:3306/event_management_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# "update" lets Hibernate auto-create/update tables from the entity classes
# on startup, so no manual SQL is required for a first run.
# (database/schema.sql is provided separately as a reference / manual option.)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===== Jackson (JSON) =====
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.default-property-inclusion=non_null
