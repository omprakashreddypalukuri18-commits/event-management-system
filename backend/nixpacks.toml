# Explicit build/start config for Railway (Nixpacks).
# Railway's service "Root Directory" must be set to "backend" so this file
# (and pom.xml) are found at the build context root.

[phases.setup]
nixPkgs = ["jdk17", "maven"]

[phases.build]
cmds = ["mvn -B -DskipTests package"]

[start]
cmd = "java -jar target/event-management-system.jar"
